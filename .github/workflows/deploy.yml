name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY_B64" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          VPS_HOST="$(echo "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(echo "$VPS_USER" | tr -d '[:space:]')"
          # The remote script is idempotent (git reset --hard, npm ci, build,
          # pm2 restart), so a transient SSH/network drop can be safely retried.
          cat > /tmp/remote.sh <<'REMOTE'
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            # Pin to the Node version the pm2 daemon runs on. `nvm install --lts`
            # floated to a new patch and nvm keeps global pkgs (pm2) per-version,
            # which broke `pm2 restart` (command not found) and risks a 2nd pm2
            # daemon fighting for port 3000. Keep this in lockstep with the daemon.
            nvm install 24.18.0 >/dev/null 2>&1 || true
            nvm use 24.18.0
            node -v || { echo "Node not available after nvm"; exit 1; }
            command -v pm2 >/dev/null 2>&1 || npm install -g pm2 >/dev/null 2>&1
            cd ~/htdocs/srv1815484.hstgr.cloud/Fashion-Palette/fashion-palette
            echo "==> Pull latest"
            git fetch origin main
            git reset --hard origin/main
            echo "==> Install deps"
            npm ci
            echo "==> Rebuild native modules (sharp/esbuild)"
            npm rebuild sharp esbuild --foreground-scripts
            echo "==> Apply known additive schema (idempotent, non-interactive)"
            # drizzle-kit push prompts on some changes (e.g. adding a NOT NULL
            # column) and there is no TTY over SSH, so it hangs/fails. This step
            # applies known new tables/columns deterministically first.
            npm run db:apply-schema
            echo "==> drizzle push (best-effort drift sync; non-fatal)"
            # After apply-schema there should be no diff. Kept as a safety net but
            # non-fatal + stdin closed so an interactive prompt cannot block deploy.
            # Switch to gated `drizzle-kit migrate` before real customer data (F32).
            npx drizzle-kit push --force < /dev/null || echo "  (drizzle push skipped — non-fatal)"
            echo "==> Build"
            npm run build
            echo "==> Restart"
            pm2 restart fashion-palette --update-env
            pm2 save
            echo "==> Done"
          REMOTE
          n=0
          until ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$VPS_USER@$VPS_HOST" bash -s < /tmp/remote.sh; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "Deploy failed after $n attempts."
              exit 1
            fi
            echo "SSH deploy attempt $n failed — retrying in 20s..."
            sleep 20
          done
          echo "Deploy succeeded."
